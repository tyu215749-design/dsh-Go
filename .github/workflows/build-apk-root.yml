name: Build APK (root launch)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Cache runtime downloads
        uses: actions/cache@v4
        with:
          path: runtime/.cache
          key: runtime-${{ hashFiles('runtime/build-runtime.sh') }}

      - name: Build arm64 runtime
        run: runtime/build-runtime.sh arm64-v8a

      - name: Build APK
        run: tooling/build-apk.sh -f arm64

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-root-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
          if-no-files-found: error
